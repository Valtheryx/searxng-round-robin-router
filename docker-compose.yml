services:
  searx-router:
    image: node:22-alpine
    container_name: searx-router
    entrypoint: ["node"]
    command: ["/app/router.js"]
    environment:
      SEARXNG_URL: "${SEARXNG_URL:-http://127.0.0.1:8080}"
      ROUTER_PORT: "8080"
      # optional, valid JSON array-of-arrays with SearXNG engine shortcuts
      GROUPS: "${GROUPS:-}"
    volumes:
      - ./:/app:ro
    ports:
      - "${ROUTER_HOST_PORT:-8096}:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true