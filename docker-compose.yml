services:
  searx-router:
    image: node:22-alpine
    container_name: searx-router
    entrypoint: ["node"]
    command: ["/app/router.js"]
    environment:
      SEARXNG_URL: "${SEARXNG_URL:?Set SEARXNG_URL to your reachable SearXNG URL}"
      ROUTER_PORT: "8080"
      GROUPS: "${GROUPS:-}"
      FALLBACK_ATTEMPTS: "${FALLBACK_ATTEMPTS:-}"
      FALLBACK_ON_EMPTY: "${FALLBACK_ON_EMPTY:-}"
      UPSTREAM_TIMEOUT_MS: "${UPSTREAM_TIMEOUT_MS:-}"
    volumes:
      - "${ROUTER_CONFIG_DIR:-.}:/app:ro"
    ports:
      - "${ROUTER_HOST_IP:-0.0.0.0}:${ROUTER_HOST_PORT:-8096}:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true