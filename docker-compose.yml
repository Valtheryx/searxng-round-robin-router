services:
  searx-router:
    image: ghcr.io/gethomepage/homepage:latest   # any image with Node.js >= 18 works
    container_name: searx-router
    entrypoint: ["node"]
    command: ["/router.js"]
    environment:
      SEARXNG_URL: "http://172.30.1.3:8093"      # your SearXNG instance
      ROUTER_PORT: "8080"
      # optional: override the rotation groups (engine shortcuts from SearXNG /config)
      # GROUPS: '["ddg","yh","mwm"],["goc","szn","yd"]'  # use valid JSON array-of-arrays instead
    volumes:
      - ./router.js:/router.js:ro
    ports:
      - "8096:8080"                              # host port exposed to clients
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true